<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy (CSP) per RFC 016
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        img-src 'self' data: https://api.yotoplay.com https://card-content.yotoplay.com https://*.prxu.org https://*.podtrac.com;
        media-src 'self' blob: https://secure-media.yotoplay.com https://*.prxu.org https://*.podtrac.com;
        connect-src 'self'
          https://login.yotoplay.com
          https://api.yotoplay.com
          https://*.s3.amazonaws.com
          wss://*.iot.eu-west-2.amazonaws.com
          https://corsproxy.io
          https://www.google-analytics.com;
        base-uri 'self';
        form-action 'none';
      "
    />
    <title>YotoBench - Unofficial Yoto Power Tools</title>
    <meta name="description" content="A modern, responsive, client-side web application for managing your Yoto Player library, cards, and devices directly in the browser." />
    <meta property="og:title" content="YotoBench - Unofficial Yoto Power Tools" />
    <meta property="og:description" content="A modern, responsive, client-side web application for managing your Yoto Player library, cards, and devices directly in the browser." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <yb-app></yb-app>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
